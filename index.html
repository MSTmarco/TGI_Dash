<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villavicencio Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121A2B; --bg-deep: #0B111E; --panel: rgba(11,17,30,0.72); --edge: #2B3854;
  --ink: #EEF2F8; --ink-2: #B9C3D6; --dim: #8D9AB2; --grid: #24304A;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --critical: #d03b3b; --warning: #fab219; --good: #0ca30c;
  --read: #5E8FF0; --mech: #8193B3;
  --line: #C9D3E6; --stop: rgba(141,154,178,0.08);
  --display: 'Space Grotesk', system-ui, sans-serif; --sans: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(circle at 50% 30%, #1A2540 0%, var(--bg) 55%, var(--bg-deep) 100%) fixed, var(--bg);
  color: var(--ink); font: 14px/1.45 var(--sans); min-height: 100vh;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 16px 24px 40px; }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 16px; }
.panel h2 { font: 600 13px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; }
.ph .sp { flex: 1; }

/* barra de control: fija arriba, con el tiempo */
.bar { position: sticky; top: 0; z-index: 10; background: rgba(11,17,30,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--edge); }
.bar .in { max-width: 1480px; margin: 0 auto; padding: 10px 24px 10px; }
.r1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.brand { font: 700 15px var(--display); letter-spacing: 0.18em; color: var(--ink-2); }
h1 { font: 600 20px/1.2 var(--display); margin: 0; flex: 1 1 360px; min-width: 0; }
h1 small { display: block; font: 400 13px var(--sans); color: var(--dim); margin-top: 2px; }
select { font: 500 14px var(--sans); color: var(--ink); background: #1B2540; border: 1px solid var(--edge); border-radius: 8px; padding: 7px 10px; cursor: pointer; min-width: 0; max-width: 100%; text-overflow: ellipsis; }
select:hover { border-color: #3D4D70; }
.state { display: inline-flex; align-items: center; gap: 8px; font: 600 12px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--good); color: var(--ink); background: rgba(12,163,12,0.10); white-space: nowrap; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.state b { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.state.over { border-color: var(--warning); background: rgba(250,178,25,0.10); } .state.over i { background: var(--warning); }
.state.alarm { border-color: var(--critical); background: rgba(208,59,59,0.16); } .state.alarm i { background: var(--critical); animation: blink 1.2s steps(2) infinite; }
.state.off { border-color: var(--edge); background: transparent; } .state.off i { background: var(--dim); }
@keyframes blink { 50% { opacity: 0.25; } }
.clock { font: 500 20px var(--mono); min-width: 210px; }
.r2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 8px; }
button { font: 500 13px var(--sans); color: var(--ink); background: #1B2540; border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: #3D4D70; }
button.on { background: #24345A; border-color: #4A5F8F; }
.track { position: relative; flex: 1 1 300px; min-width: 200px; }
#scrub { width: 100%; accent-color: var(--read); display: block; margin: 0; }
.marks { position: absolute; left: 8px; right: 8px; top: -9px; height: 12px; pointer-events: none; }
.marks button { position: absolute; top: 0; width: 14px; height: 12px; margin-left: -7px; padding: 0; border: none; background: none; pointer-events: auto; cursor: pointer; }
.marks button::after { content: ''; position: absolute; left: 6px; top: 2px; width: 2px; height: 8px; border-radius: 1px; background: #8D9AB2; }
.marks button.stop::after { background: var(--critical); }
.marks button.al::after { background: var(--warning); }
.marks button:hover::after { width: 4px; left: 5px; }
.rng { font: 400 12px var(--mono); color: var(--dim); white-space: nowrap; }

/* diagrama del paquete */
.plantwrap { overflow-x: auto; }
#plant { display: block; width: 100%; min-width: 820px; height: auto; }
#plant .b { fill: rgba(11,17,30,0.9); stroke: var(--edge); stroke-width: 1.3; }
#plant .t { font: 600 14px var(--sans); fill: var(--ink); }
#plant .s { font: 400 11px var(--mono); fill: var(--dim); }
#plant .chip rect { fill: rgba(36,48,74,0.35); stroke: var(--grid); }
#plant .chip text { font: 400 11px var(--mono); fill: var(--ink-2); }
#plant .chip.lee rect { stroke: var(--read); fill: rgba(94,143,240,0.13); }
#plant .chip.lee text { fill: var(--ink); }
#plant .ring { fill: none; stroke-width: 2; display: none; }
#plant .blk.dev .b, #plant .blk.watch .b, #plant .blk.warn .b { stroke: var(--warning); }
#plant .blk.event .b { stroke: var(--critical); }
#plant .blk.warn .ring { display: block; stroke: var(--warning); animation: blink 1.2s steps(2) infinite; }
#plant .blk.event .ring { display: block; stroke: var(--critical); }
#plant .blk.warn .chip.causa rect { stroke: var(--warning); fill: rgba(250,178,25,0.18); }
#plant .blk.event .chip.causa rect { stroke: var(--critical); fill: rgba(208,59,59,0.22); }
#plant .blk.warn .chip.causa text, #plant .blk.event .chip.causa text { fill: var(--ink); font-weight: 500; }
#plant .flow { fill: none; stroke: var(--mech); stroke-width: 2.5; stroke-dasharray: 10 8; }
#plant .flow.agua { stroke-width: 1.5; stroke-dasharray: 5 6; }
#plant .mech { fill: none; stroke: var(--mech); stroke-width: 4; opacity: 0.45; }
#plant .ah { fill: var(--mech); }
#plant.run .flow { animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { #plant.run .flow, .state.alarm i, #plant .blk.warn .ring { animation: none; } }
#plant .lb { font: 500 11px var(--sans); fill: var(--dim); letter-spacing: 0.08em; }
#plant .ld { stroke: #3A4763; stroke-width: 1; stroke-dasharray: 2 3; }
#plant .ld.on { stroke: var(--read); stroke-dasharray: none; }
#plant .ins circle { fill: var(--bg-deep); stroke: #55627E; stroke-width: 1.2; }
#plant .ins text { font: 500 9.5px var(--mono); fill: var(--dim); }
#plant .ins .tg { font: 400 10px var(--mono); fill: #6F7C96; }
#plant .ins .vl { font: 500 11.5px var(--mono); fill: var(--ink); }
#plant .ins.on circle { stroke: var(--read); stroke-width: 2; }
#plant .ins.on text, #plant .ins.on .tg { fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12px var(--sans); color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 10px; vertical-align: -1px; margin-right: 6px; border-radius: 2px; border: 1.5px solid; }
.legend i.ln { height: 2px; border: none; }
.story { margin-top: 8px; border-left: 3px solid var(--edge); padding: 4px 0 4px 12px; min-height: 48px; font-size: 15px; color: var(--ink); transition: border-color .2s; }
.story.hot { border-left-color: var(--critical); }
.story small { display: block; color: var(--dim); font: 500 12px var(--mono); margin-bottom: 2px; }
/* guion del presentador: todos los pasos, el actual resaltado; un clic salta a ese momento */
.guion { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.guion button { width: 100%; text-align: left; white-space: normal; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; background: rgba(27,37,64,0.5); }
.guion button small { font: 500 11px var(--mono); color: var(--dim); display: flex; gap: 8px; align-items: center; }
.guion button span { font: 500 13px var(--sans); }
.guion li.fut button { opacity: 0.5; }
.guion li.cur button { border-color: var(--read); background: #24345A; opacity: 1; }
.salud { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.salud i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.salud.watch i, .salud.dev i { background: var(--warning); } .salud.warn i, .salud.event i { background: var(--critical); } .salud.off i { background: var(--dim); }

/* graficos */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.grid > * { min-width: 0; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.chart { position: relative; }
.chart + .chart { margin-top: 6px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ttl { display: flex; align-items: baseline; gap: 10px; font: 600 13px var(--sans); color: var(--ink); margin: 6px 0 0; }
.chart .ttl code { font: 500 12px var(--mono); color: var(--ink-2); background: rgba(11,17,30,0.6); border: 1px solid var(--grid); border-radius: 5px; padding: 1px 6px; }
.chart .ttl .lgd { margin-left: auto; font-weight: 500; }
.axis text, .lab { font: 400 11px var(--sans); fill: var(--dim); }
.trk { font: 600 11px var(--sans); fill: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; }
.ev text { font: 500 11px var(--sans); fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: #0B111E; border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; font: 12px var(--sans); color: var(--ink); white-space: nowrap; display: none; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.tip .h { color: var(--dim); font: 500 11px var(--mono); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-family: var(--mono); }
.tip .sw { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }

/* features */
.firmas-panel { margin-top: 16px; }
.firmas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 8px; }
.firma { border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.firma .fh { display: flex; align-items: center; gap: 8px; }
.firma .fh b { font: 600 14px var(--sans); flex: 1; min-width: 0; }
.firma .fh i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; flex: none; }
.firma .now { font: 500 13px var(--mono); color: var(--ink-2); }
.fx { margin-top: 6px; }
.fx code { display: block; font: 500 13px/1.5 var(--mono); color: var(--ink); background: rgba(11,17,30,0.6); border: 1px solid var(--grid); border-radius: 6px; padding: 5px 8px; overflow-x: auto; white-space: nowrap; }
.firma p { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
@media (max-width: 760px) { .bar { position: static; } }
@media (max-width: 600px) { .wrap, .bar .in { padding-left: 16px; padding-right: 16px; } h1 { font-size: 18px; flex-basis: 100%; } .firmas { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <div class="in">
    <div class="r1">
      <div class="brand">VÖRNTEC</div>
      <h1 id="title">—</h1>
      <select id="falla" aria-label="Elegir falla"></select>

    </div>
    <div class="r2">
      <div class="clock" id="clock">—</div>
      <button id="play" aria-label="Reproducir">▶ Reproducir</button>
      <button id="speed">×1</button>
      <div class="track">
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Línea de tiempo">
        <div class="marks" id="marks"></div>
      </div>
      <span class="rng" id="rng">—</span>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="panel">
    <div class="ph"><h2 id="unit">UC-1 · Ariel JGT/4 + Waukesha L5794GSI</h2></div>
    <div class="plantwrap"><svg id="plant" viewBox="0 0 1260 540" role="img" aria-label="Diagrama del paquete compresor: gas, compresor, enfriador, motor, bastidor y panel"></svg></div>
    <div class="story" id="story" aria-live="polite"></div>
    <ol class="guion" id="guion" aria-label="Pasos de la demo"></ol>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="ph"><h2>SCADA</h2></div>
      <div id="raw"></div>
    </section>
    <section class="panel">
      <div class="ph"><h2>Agente</h2></div>
      <div id="model"></div>
    </section>
  </div>

  <section class="panel firmas-panel">
    <h2>Lo que mira el agente · features de ingeniería</h2>
    <div class="firmas" id="firmas"></div>
  </section>
</div>

// alarmas: mismo criterio que el analisis (horas evaluadas seguidas sobre el umbral; una hora sin dato corta la racha)
function detect(series, thr) {
  let first = null, alarm = null, run = 0;
  const state = series.map((v, i) => {
    const over = v != null && v > thr;
    run = over ? run + 1 : 0;
    if (over && first == null) first = i;
    if (run >= ALARM_H && alarm == null) alarm = i;
    return run >= ALARM_H ? 2 : over ? 1 : 0;
  });
  return {first, alarm, state};
}

// ---------- graficos ----------
// Un grafico puede tener varias pistas (F arriba, score abajo) con el mismo eje de tiempo.
const M = {l: 46, r: 14, t: 30, b: 22};
function makeChart(host, opts) {
  const box = document.createElement('div'); box.className = 'chart'; box.id = `ch-${charts.length}`;
  box.innerHTML = `<div class="ttl">${opts.ttl}</div>`;
  host.appendChild(box);
  const svg = el('svg', {height: opts.h}, box);
  const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
  const c = {host: box, svg, tip, ...opts};
  charts.push(c);
  return c;
}

function pathOf(s, X, Y) {
  let d = '', pen = false;
  s.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`; pen = true; });
  return d;
}
function draw(c) {
  const W = c.host.clientWidth; c.svg.setAttribute('width', W); c.svg.innerHTML = '';
  const iw = W - M.l - M.r, top = M.t, bot = c.h - M.b;
  const X = (i) => M.l + (POS[Math.max(0, Math.min(N - 1, i))] / POS[N - 1]) * iw;
  // pistas: reparten la altura, con un hueco para el nombre de cada pista que no es la primera
  const GAP = 26, avail = bot - top - GAP * (c.tracks.length - 1);
  let yy = top;
  for (const tr of c.tracks) {
    tr.top = yy; tr.ih = avail * tr.frac; yy += tr.ih + GAP;
    const [y0, y1] = tr.dom;
    tr.Y = (v) => tr.top + tr.ih - ((Math.min(Math.max(v, y0), y1) - y0) / (y1 - y0)) * tr.ih;
  }
  Object.assign(c, {X, iw, W});
  // tramos parados (comprimidos), con su duracion si entra
  for (const [a, b] of STOPS) {
    const x = X(a), w = Math.max(2, X(Math.min(b, N - 1)) - x);
    el('rect', {x, y: top, width: w, height: bot - top, fill: 'var(--stop)'}, c.svg);
    const days = (b - a) / 24;
    if (c.labels && w > 30 && days >= 1) el('text', {x: x + w / 2, y: bot - 8, 'text-anchor': 'middle', class: 'lab'}, c.svg).textContent = `parada ${days.toFixed(0)} d`;
  }
  // grilla y ejes
  const ax = el('g', {class: 'axis'}, c.svg);
  const STEPS = [0.01, 0.02, 0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 20, 50, 100];
  for (const tr of c.tracks) {
    const [y0, y1] = tr.dom, rg = y1 - y0;
    // paso del eje: el de siempre, y mas grande si las etiquetas no entran en la altura
    let step = tr.step || (rg > 60 ? 20 : rg > 40 ? 10 : rg > 10 ? 5 : rg > 2 ? 1 : rg > 0.5 ? 0.25 : 0.01);
    while (rg / step > tr.ih / 13 && step < 100) step = STEPS[STEPS.indexOf(step) + 1];
    for (let v = Math.ceil(y0 / step) * step; v <= y1 + 1e-9; v += step) {
      el('line', {x1: M.l, x2: M.l + iw, y1: tr.Y(v), y2: tr.Y(v), stroke: 'var(--grid)', 'stroke-width': 1}, ax);
      el('text', {x: M.l - 8, y: tr.Y(v) + 4, 'text-anchor': 'end'}, ax).textContent = num(v, step < 1 ? 2 : 0);
    }
    if (tr.label) el('text', {x: M.l, y: tr.top - 9, class: 'trk'}, c.svg).textContent = tr.label;
  }
  let lastX = -1e9;
  for (let i = 0; i < N; i++) {
    const d = tAt(i);
    if (d.getHours() === 0 && DATA.run[i] && X(i) - lastX > 44) {
      el('text', {x: X(i), y: c.h - 4, 'text-anchor': 'middle'}, ax).textContent = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
      lastX = X(i);
    }
  }
  // eventos
  const ev = el('g', {class: 'ev'}, c.svg);
  const rowX = [-1e9, -1e9];
  EVENTS.forEach((e) => {
    el('line', {x1: X(e.i), x2: X(e.i), y1: top, y2: bot, stroke: e.stop ? 'var(--critical)' : '#55627E', 'stroke-width': e.stop ? 1.5 : 1, 'stroke-dasharray': e.stop ? '' : '3 3'}, ev);
    // etiqueta en la fila libre; si no entra en ninguna, se omite (el boton de salto la nombra igual)
    const row = [0, 1].find((r) => X(e.i) - rowX[r] > 34);
    if (c.labels && row != null) {
      el('text', {x: X(e.i), y: top - 6 - row * 13, 'text-anchor': 'middle'}, ev).textContent = e.short;
      rowX[row] = X(e.i);
    }
  });
  // umbral, series (la parte reproducida a color pleno, el resto tenue)
  c.clip = el('clipPath', {id: `clip-${c.host.id}`}, el('defs', {}, c.svg));
  c.clipRect = el('rect', {x: 0, y: 0, width: 0, height: c.h}, c.clip);
  for (const tr of c.tracks) {
    if (tr.thr != null) {
      el('line', {x1: M.l, x2: M.l + iw, y1: tr.Y(tr.thr), y2: tr.Y(tr.thr), stroke: 'var(--warning)', 'stroke-width': 1.5, 'stroke-dasharray': '6 4'}, c.svg);
      el('text', {x: M.l + iw - 4, y: tr.Y(tr.thr) - 5, class: 'lab', 'text-anchor': 'end'}, c.svg).textContent = `umbral ${String(tr.thr).replace('.', ',')}`;
    }
    for (const sr of tr.series) {
      const d = pathOf(sr.s, X, tr.Y);
      el('path', {d, fill: 'none', stroke: sr.color, 'stroke-width': 2, opacity: 0.18, 'stroke-linejoin': 'round'}, c.svg);
      el('path', {d, fill: 'none', stroke: sr.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'clip-path': `url(#clip-${c.host.id})`}, c.svg);
    }
  }
  // marca de alarma
  c.alarmMark = null;
  if (c.det && c.det.alarm != null) {
    const g = el('g', {}, c.svg); c.alarmMark = g; g.style.display = 'none';
    const x = X(c.det.alarm);
    el('line', {x1: x, x2: x, y1: top, y2: bot, stroke: 'var(--critical)', 'stroke-width': 2}, g);
    el('text', {x: x - 6, y: top + 12, 'text-anchor': 'end', fill: '#EEF2F8', 'font-size': 12, 'font-weight': 600}, g).textContent = `⚠ ALARMA ${fmt(tAt(c.det.alarm))}`;
  }
  c.head = el('line', {y1: top - 4, y2: bot, stroke: '#EEF2F8', 'stroke-width': 1.5}, c.svg);
  c.hover = el('line', {y1: top, y2: bot, stroke: '#8D9AB2', 'stroke-width': 1, opacity: 0}, c.svg);
  el('rect', {x: M.l, y: top, width: iw, height: bot - top, fill: 'transparent'}, c.svg);
}

// tooltip compartido (crosshair en todos los graficos)
function showTip(c, i, px) {
  const d = tAt(i);
  const rows = c.tracks.flatMap((tr) => tr.series).map((sr) => `<div class="r"><span><span class="sw" style="background:${sr.color}"></span>${sr.name}</span><span>${sr.s[i] == null ? '—' : num(sr.s[i], sr.nd ?? (sr.unit ? 1 : 2)) + (sr.unit ? ' ' + sr.unit : '')}</span></div>`).join('');
  const st = DATA.run[i] ? `carga ${DATA.carga[i] == null ? '—' : DATA.carga[i].toFixed(0)} %` : 'máquina parada';
  c.tip.innerHTML = `<div class="h">${fmt(d)} · ${st}</div>${rows}`;
  c.tip.style.display = 'block';
  const left = Math.min(px + 14, c.W - c.tip.offsetWidth - 4);
  c.tip.style.left = `${Math.max(0, left)}px`; c.tip.style.top = `${M.t + 30}px`;
}
function idxAtX(c, px) {
  let lo = 0, hi = N - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (c.X(mid) < px) lo = mid + 1; else hi = mid; }
  return lo > 0 && px - c.X(lo - 1) < c.X(lo) - px ? lo - 1 : lo;
}
function hideTips() { charts.forEach((c) => { c.tip.style.display = 'none'; c.hover.setAttribute('opacity', 0); }); }
function bindChart(c) {
  c.svg.addEventListener('pointermove', (e) => {
    const r = c.svg.getBoundingClientRect(); const px = e.clientX - r.left;
    if (px < M.l || px > M.l + c.iw) return hideTips();
    const i = idxAtX(c, px);
    charts.forEach((o) => { o.hover.setAttribute('x1', o.X(i)); o.hover.setAttribute('x2', o.X(i)); o.hover.setAttribute('opacity', 0.8); });
    charts.forEach((o) => { if (o !== c) o.tip.style.display = 'none'; });
    showTip(c, i, px);
  });
  c.svg.addEventListener('pointerleave', hideTips);
  c.svg.addEventListener('click', (e) => {
    const r = c.svg.getBoundingClientRect();
    pause(); setT(idxAtX(c, e.clientX - r.left));
  });
}

// ---------- features de ingenieria ----------
// Medias moviles sobre las horas de marcha (sin las primeras 6 h de cada arranque) y deltas entre dos variables.
// Cada una en desvios (σ) de su valor normal: la marcha del primer 40 % de la ventana antes de la parada.
const WARM_H = 6, REF_FRAC = 0.4;
function computeFeatures() {
  let c = 0;
  const ok = DATA.run.map((r) => (c = r ? c + 1 : 0) > WARM_H);
  const pre = ok.flatMap((v, i) => (v && i < STOP_I ? [i] : []));
  const ref = pre.slice(0, Math.floor(pre.length * REF_FRAC));
  // 'a/b' y 'a-b': cociente o diferencia hora a hora antes de promediar (presion por rpm, banco contra banco)
  const ser = (k) => {
    const [a, op, b] = k.split(/([/-])/);
    if (!op) return DATA[a];
    return DATA[a].map((v, i) => { const w = DATA[b][i]; return v == null || w == null || (op === '/' && !w) ? null : op === '/' ? v / w : v - w; });
  };
  const roll = (s, h) => { let buf = []; return s.map((v, i) => { if (ok[i] && v != null) { buf.push(v); if (buf.length > h) buf.shift(); } return ok[i] && v != null ? buf.reduce((x, y) => x + y, 0) / buf.length : null; }); };
  const z = (s) => {
    const v = ref.map((i) => s[i]).filter((x) => x != null), m = v.reduce((x, y) => x + y, 0) / v.length;
    const sd = Math.sqrt(v.reduce((x, y) => x + (y - m) ** 2, 0) / v.length) || 1;
    return s.map((x) => (x == null ? null : (x - m) / sd));
  };
  F.feats.forEach((fe) => {
    const za = z(roll(ser(fe.a), fe.h));
    if (fe.op === 'roll') { DATA[fe.key] = za; return; }
    const zb = z(roll(ser(fe.b), fe.h));
    DATA[fe.key] = za.map((x, i) => (x == null || zb[i] == null ? null : x - zb[i]));
  });
  // eje: lo que ocupan los features, con aire, siempre con el 0
  const all = F.feats.flatMap((fe) => DATA[fe.key]).filter((x) => x != null);
  return [Math.floor(Math.min(0, ...all) - 0.5), Math.ceil(Math.max(0, ...all) + 0.5)];
}
function renderFeatures() {
  document.getElementById('firmas').innerHTML = F.feats.map((fe, k) => `<div class="firma">
      <div class="fh"><i style="background:${HEX[k]}"></i><b>${fe.name}</b><span class="now" id="now-${fe.key}">—</span></div>
      <div class="fx"><code>${fe.calc}</code></div>
      <p>${fe.por}</p>
    </div>`).join('');
}

// ---------- estado en el tiempo ----------
let t = 0;
const scrub = document.getElementById('scrub');
const fmtZ = (v) => v == null ? '—' : `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1).replace('.', ',')} σ`;
const storyEl = document.getElementById('story');
const guionEl = document.getElementById('guion');
const stateEl = document.getElementById('state');
function estadoAt(i) {
  const run = !!DATA.run[i], st = DET.state[i], alarm = DET.alarm != null && i >= DET.alarm && i < STOP_I;
  const stopped = i >= STOP_I && !(run && i > STOP_I + 24);
  const desvio = i >= DESVIO_I && i < STOP_I;
  return stopped ? 'event' : alarm || st === 2 ? 'warn' : st === 1 ? 'watch' : run ? (desvio ? 'dev' : 'ok') : 'off';
}
const SALUD = {ok: 'Salud buena', dev: 'En observación · desvío leve', watch: 'En observación · alerta del agente', warn: 'En riesgo · alarma', event: 'Parada por falla', off: 'Máquina parada'};
const salud = (i) => { const e = estadoAt(i); return `<span class="salud ${e}"><i></i>${SALUD[e]}</span>`; };
function render() {
  const i = t;
  scrub.value = i;
  const run = !!DATA.run[i];
  document.getElementById('clock').textContent = `${fmt(tAt(i))} · ${tAt(i).getFullYear()}`;
  charts.forEach((c) => {
    const x = c.X(i);
    c.head.setAttribute('x1', x); c.head.setAttribute('x2', x);
    c.clipRect.setAttribute('width', x);
    if (c.alarmMark) c.alarmMark.style.display = i >= c.det.alarm ? '' : 'none';
  });
  // estado: la alarma queda hasta la parada; despues de la parada, evento hasta que vuelve a marchar
  const estado = estadoAt(i) === 'off' ? 'ok' : estadoAt(i);
  const ml = at(DATA.ml, i);
  stateEl.className = `state ${estado === 'event' ? 'alarm' : estado === 'warn' ? 'alarm' : estado === 'watch' || estado === 'dev' ? 'over' : run ? '' : 'off'}`;
  document.getElementById('state-t').textContent = estado === 'event' ? 'Parada por falla' : estado === 'warn' ? `Alarma desde ${fmt(tAt(DET.alarm ?? i))}` : estado === 'watch' ? 'Alerta del agente' : estado === 'dev' ? 'Desvío leve' : run ? 'Normal' : 'Máquina parada';
  document.getElementById('state-s').textContent = `score ${ml == null ? '—' : ml.toFixed(2).replace('.', ',')}`;
  const vals = {};
  // dos variables en el mismo instrumento (los dos lados del ventilador, los dos bancos) van juntas
  if (run) F.raw.forEach((r) => { const v = at(DATA[r.key], i); if (v != null) vals[r.ins] = [vals[r.ins], `${r.pre ?? ''}${num(v, r.nd)} ${r.unit}`].filter(Boolean).join(' · '); });
  PLANT.update(estado, run, vals);
  const ch = [...STORY].reverse().find((s) => s.i <= i) || STORY[0];
  storyEl.innerHTML = `<small>${fmt(tAt(ch.i))} · ${salud(i)}</small><b>${ch.h}.</b> ${ch.txt}`;
  guionEl.querySelectorAll('li').forEach((li, k) => { li.className = STORY[k] === ch ? 'cur' : STORY[k].i > i ? 'fut' : ''; });
  storyEl.classList.toggle('hot', !!ch.hot && i <= STOP_I);
  F.feats.forEach((fe) => { document.getElementById(`now-${fe.key}`).textContent = run ? fmtZ(at(DATA[fe.key], i)) : '—'; });
}
function setT(i) { t = Math.max(0, Math.min(N - 1, i)); render(); }
scrub.addEventListener('input', () => { pause(); setT(+scrub.value); });

// reproduccion: con la maquina en marcha va hora por hora; las horas paradas pasan rapido
const SPEEDS = [1, 2, 4];
let speedK = 0, timer = null;
const playBtn = document.getElementById('play');
function tick() {
  if (t >= N - 1) return pause();
  setT(t + 1);
  // frena 1,5 s en cada evento para poder contarlo
  const hitEvent = STORY.some((s) => s.i === t) || EVENTS.some((e) => e.i === t);
  const base = DATA.run[t] ? 140 : 18;
  timer = setTimeout(tick, (hitEvent ? 1500 : base) / SPEEDS[speedK]);
}
function play() { if (t >= N - 1) setT(0); playBtn.textContent = '❚❚ Pausa'; playBtn.classList.add('on'); clearTimeout(timer); tick(); }
function pause() { clearTimeout(timer); timer = null; playBtn.textContent = '▶ Reproducir'; playBtn.classList.remove('on'); }
playBtn.addEventListener('click', () => (timer ? pause() : play()));
document.getElementById('speed').addEventListener('click', (e) => { speedK = (speedK + 1) % SPEEDS.length; e.target.textContent = `×${SPEEDS[speedK]}`; });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); timer ? pause() : play(); }
  if (e.key === 'ArrowRight') setT(t + 1);
  if (e.key === 'ArrowLeft') setT(t - 1);
});

// ---------- cambiar de falla ----------
function load(id, hashT) {
  pause();
  F = FALLAS.find((f) => f.id === id) || FALLAS[0];
  DATA = {...F.data()};  // copia: los features se escriben en DATA y no deben tocar la serie original
  T0 = new Date(DATA.t0.replace(' ', 'T'));
  N = DATA.n;
  EVENTS = F.events.map((e) => ({...e, i: idxOf(e.at)}));
  STOP_I = EVENTS.find((e) => e.stop).i;
  DESVIO_I = idxOf(F.desvio);
  // el score sólo existe donde hay features (no en las primeras horas de cada arranque)
  const fDom = computeFeatures();
  DATA.ml = DATA.ml.map((v, i) => (F.feats.some((fe) => DATA[fe.key][i] != null) ? v : null));
  DET = detect(DATA.ml, DATA.ml_thr);
  STORY = F.story
    .filter(([when]) => (when !== 'alarm' || DET.alarm != null) && (when !== 'first' || DET.first != null))
    .map(([when, h, txt, hot]) => {
      const i = when === 'alarm' ? DET.alarm : when === 'first' ? DET.first : when === 'desvio' ? DESVIO_I : idxOf(when);
      return {i, h, txt: typeof txt === 'function' ? txt(DATA, i) : txt, hot};
    });
  // eje comprimido: una hora en marcha ocupa 1, una hora parada 0,04
  POS = [0];
  for (let i = 1; i < N; i++) POS.push(POS[i - 1] + (DATA.run[i - 1] ? 1 : 0.04));
  STOPS = [];
  for (let i = 0, s0 = null; i <= N; i++) {
    const stopped = i < N && !DATA.run[i];
    if (stopped && s0 == null) s0 = i;
    if (!stopped && s0 != null) { STOPS.push([s0, i]); s0 = null; }
  }
  // paradas y arranques de la maquina antes de la falla (si no hay ya un paso a esa hora)
  const libre = (i) => !STORY.some((s) => Math.abs(s.i - i) <= 3);
  STOPS.filter(([a, b]) => b - a >= 4 && a < STOP_I && a > 0).forEach(([a, b]) => {
    if (libre(a)) STORY.push({i: a, h: 'La máquina para', txt: `La unidad queda parada ${durac(b - a)}. Sin marcha no hay datos y el agente espera a que vuelva a arrancar.`});
    if (b < STOP_I && libre(b)) STORY.push({i: b, h: 'Rearranque', txt: 'La unidad vuelve a marchar y el agente retoma la lectura.'});
  });
  STORY.sort((a, b) => a.i - b.i);

  document.getElementById('title').innerHTML = `${F.unit} ${F.fam}: ${F.nombre}<small>${F.simple}</small><small>${F.sub}</small>`;
  document.getElementById('rng').textContent = F.rng;
  document.title = `Villavicencio ${F.unit} · ${F.id}`;
  document.getElementById('unit').textContent = `${F.unit} · Ariel JGT/4 + Waukesha L5794GSI`;
  PLANT.build(F.plant);

  // SCADA a la izquierda; F y score en un solo grafico a la derecha, con la misma altura total
  const rawEl = document.getElementById('raw'), modelEl = document.getElementById('model');
  rawEl.innerHTML = ''; modelEl.innerHTML = ''; charts = [];
  const rh = F.raw.length > 2 ? 130 : 160;
  F.raw.forEach((r, k) => makeChart(rawEl, {
    ttl: `${r.name} <code>${r.tag} · ${r.unit}</code>`, h: rh, labels: k === 0,
    tracks: [{frac: 1, dom: r.dom, series: [{s: DATA[r.key], color: HEX[k], name: r.name, unit: r.unit, nd: r.nd}]}],
  }));
  const lgd = F.feats.map((fe, k) => `<span><i class="ln" style="background:${HEX[k]}"></i>${fe.short}</span>`).join('');
  makeChart(modelEl, {
    ttl: `Features <code>σ</code><span class="legend lgd">${lgd}</span>`, h: F.raw.length * (rh + 28) - 28, labels: true, det: DET,
    tracks: [
      {frac: 0.6, dom: fDom, series: F.feats.map((fe, k) => ({s: DATA[fe.key], color: HEX[k], name: fe.short, unit: 'σ'}))},
      {frac: 0.4, dom: [0, 1], step: 0.5, thr: DATA.ml_thr, label: 'Score del agente', series: [{s: DATA.ml, color: '#C9D3E6', name: 'Score', unit: ''}]},
    ],
  });
  charts.forEach(bindChart);

  renderFeatures();

  // en un rearranque la hora del evento todavia es parada: la salud es la de la hora siguiente
  const sI = (i) => (!DATA.run[i] && DATA.run[i + 1] ? i + 1 : i);
  guionEl.innerHTML = STORY.map((s) => `<li><button type="button"><small>${fmt(tAt(s.i))} ${salud(sI(s.i))}</small><span>${s.h}</span></button></li>`).join('');
  guionEl.querySelectorAll('button').forEach((b, k) => b.addEventListener('click', () => { pause(); setT(STORY[k].i); }));

  // eventos: marcas sobre la linea de tiempo; un clic salta a ese momento
  const marks = document.getElementById('marks'); marks.innerHTML = '';
  [
    ...EVENTS.map((e) => ({i: e.i, label: `${e.short} · ${e.label}`, cl: e.stop ? 'stop' : ''})),
    ...(DET.alarm != null ? [{i: DET.alarm, label: `${fmt(tAt(DET.alarm)).slice(0, 5)} · Alarma del agente`, cl: 'al'}] : []),
  ].sort((a, b) => a.i - b.i).forEach((j) => {
    const b = document.createElement('button'); b.className = j.cl; b.title = j.label; b.setAttribute('aria-label', j.label);
    b.style.left = `${(100 * j.i) / (N - 1)}%`; b.addEventListener('click', () => { pause(); setT(j.i); }); marks.appendChild(b);
  });

  scrub.max = N - 1;
  charts.forEach(draw);
  setT(idxOf(hashT || F.start));
}
